<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#eceef2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c3c8d1" stroke-width="2"/>
    </pattern>
    <clipPath id="sinoClip"><rect x="34" y="118" width="92" height="104" rx="4"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="358" rx="18" fill="#ffffff" stroke="#e3e6eb"/>

  <!-- limited-angle sinogram -->
  <g clip-path="url(#sinoClip)">
    <rect x="34" y="118" width="92" height="104" fill="url(#hatch)"/>
    <rect x="65" y="118" width="30" height="104" fill="#15181d"/>
    <path d="M65,150 C72,140 80,138 95,152" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M65,175 C75,190 86,186 95,170" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.75"/>
    <path d="M65,198 C74,190 85,204 95,196" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  <rect x="34" y="118" width="92" height="104" rx="4" fill="none" stroke="#3a4250" stroke-width="1"/>
  <text x="80" y="244" text-anchor="middle" font-size="13" fill="#1f2530"><tspan font-style="italic">y</tspan>: measured</text>
  <text x="80" y="261" text-anchor="middle" font-size="13" fill="#1f2530">sinogram (90° / 120°)</text>
  <text x="80" y="104" text-anchor="middle" font-size="11" fill="#7a8291">only part of the rotation</text>

  <!-- FBP -->
  <line x1="130" y1="170" x2="160" y2="170" stroke="#3a4250" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="162" y="148" width="64" height="44" rx="8" fill="#f1f3f6" stroke="#9aa3b2"/>
  <text x="194" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2530">FBP</text>
  <line x1="226" y1="170" x2="276" y2="170" stroke="#3a4250" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="160" text-anchor="middle" font-size="14" font-style="italic" fill="#1f2530">x⁰</text>

  <!-- unrolled stage container -->
  <rect x="280" y="34" width="530" height="276" rx="16" fill="#f7f9fc" stroke="#b9c6dc" stroke-dasharray="6 4"/>
  <text x="300" y="58" font-size="13" font-weight="bold" fill="#2a3240">Unrolled stage k = 0, …, K−1</text>
  <text x="514" y="58" font-size="12" fill="#6b7383">(K = 14, the regularizer is shared by all stages)</text>

  <!-- x^k node -->
  <circle cx="318" cy="170" r="20" fill="#ffffff" stroke="#3a4250" stroke-width="1.4"/>
  <text x="318" y="175" text-anchor="middle" font-size="14" font-style="italic" fill="#1f2530">xᵏ</text>
  <path d="M338,164 C356,150 356,114 372,112" stroke="#2f6fd0" stroke-width="1.6" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M338,176 C356,190 356,226 372,228" stroke="#d9822b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- data step -->
  <rect x="374" y="76" width="300" height="74" rx="10" fill="#eaf1fd" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="388" y="98" font-size="13" font-weight="bold" fill="#1d4f9c">Data-consistency step</text>
  <text x="388" y="118" font-size="12.5" fill="#1f2530">first order:  α<tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> A</tspan><tspan font-size="9" dy="-5">T</tspan><tspan dy="5">(A xᵏ − y)</tspan></text>
  <text x="388" y="138" font-size="12.5" fill="#1f2530">L-BFGS:  α<tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> H</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> g</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3">,  H</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> ≈ (A</tspan><tspan font-size="9" dy="-5">T</tspan><tspan dy="5">A)</tspan><tspan font-size="9" dy="-5">−1</tspan><tspan dy="5"> from earlier stages</tspan></text>

  <!-- regularizer -->
  <rect x="374" y="190" width="300" height="74" rx="10" fill="#fdf2e6" stroke="#d9822b" stroke-width="1.4"/>
  <text x="388" y="212" font-size="13" font-weight="bold" fill="#9a5414">Learned regularizer  β<tspan font-size="9" dy="3">k</tspan><tspan dy="-3"> R</tspan><tspan font-size="9" dy="3">θ</tspan><tspan dy="-3">(xᵏ)</tspan></text>
  <text x="388" y="232" font-size="12" fill="#1f2530">DenseNet encoder–decoder, 4 levels (32–256 ch.)</text>
  <text x="388" y="250" font-size="12" fill="#1f2530">one dense block per level · GroupNorm · 2.70M</text>

  <!-- combine -->
  <path d="M674,113 C700,113 704,150 716,160" stroke="#2f6fd0" stroke-width="1.6" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M674,227 C700,227 704,190 716,180" stroke="#d9822b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <circle cx="730" cy="170" r="17" fill="#ffffff" stroke="#3a4250" stroke-width="1.4"/>
  <text x="730" y="176" text-anchor="middle" font-size="18" fill="#1f2530">−</text>
  <line x1="747" y1="170" x2="782" y2="170" stroke="#3a4250" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="768" y="160" text-anchor="middle" font-size="14" font-style="italic" fill="#1f2530">xᵏ⁺¹</text>

  <!-- loop back -->
  <path d="M786,182 L786,292 L318,292 L318,194" stroke="#9aa3b2" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="552" y="287" text-anchor="middle" font-size="11.5" fill="#6b7383">next stage (K times)</text>

  <!-- output -->
  <line x1="810" y1="170" x2="846" y2="170" stroke="#3a4250" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="850" y="122" width="96" height="96" rx="8" fill="#15181d"/>
  <ellipse cx="898" cy="172" rx="36" ry="27" fill="#8d939c"/>
  <ellipse cx="910" cy="166" rx="10" ry="8" fill="#b5bac2"/>
  <circle cx="898" cy="190" r="5" fill="#eef0f3"/>
  <text x="898" y="244" text-anchor="middle" font-size="13" fill="#1f2530">reconstruction <tspan font-style="italic">x</tspan><tspan font-size="9" dy="-5" font-style="italic">K</tspan></text>

  <!-- update rule -->
  <text x="545" y="336" text-anchor="middle" font-size="14" fill="#1f2530"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="-6">k+1</tspan><tspan dy="6"> = </tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="-6">k</tspan><tspan dy="6"> − (data-consistency step) − β</tspan><tspan font-size="10" dy="4">k</tspan><tspan dy="-4"> R</tspan><tspan font-size="10" dy="4">θ</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="-6">k</tspan><tspan dy="6">)        trained end to end with an MSE loss</tspan></text>
</svg>
