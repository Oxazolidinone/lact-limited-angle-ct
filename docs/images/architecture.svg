<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="498" rx="18" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="40" y="38" font-size="15" font-weight="bold" fill="#1f2530">src/lact — layers</text>
  <text x="200" y="38" font-size="12" fill="#6b7383">dependencies only point downwards (checked by import-linter)</text>

  <!-- cli -->
  <rect x="40" y="54" width="600" height="52" rx="10" fill="#eef1f6" stroke="#9aa3b2"/>
  <text x="58" y="77" font-size="14" font-weight="bold" fill="#1f2530">cli</text>
  <text x="58" y="96" font-size="12" fill="#3a4250">lact data · ops · train · pipeline · eval · report · demo</text>
  <line x1="340" y1="106" x2="340" y2="122" stroke="#5b6475" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- services -->
  <rect x="40" y="124" width="600" height="60" rx="10" fill="#e9f0fc" stroke="#2f6fd0"/>
  <text x="58" y="147" font-size="14" font-weight="bold" fill="#1d4f9c">services</text>
  <text x="140" y="147" font-size="12" fill="#3a4250">use cases; factories.py is the single composition root</text>
  <text x="58" y="168" font-size="12" fill="#3a4250">data · operators · training · scheduling · evaluation · reporting · orchestration · demo</text>
  <line x1="340" y1="184" x2="340" y2="200" stroke="#5b6475" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- datasets -->
  <rect x="40" y="202" width="600" height="52" rx="10" fill="#edf7f1" stroke="#2f9a63"/>
  <text x="58" y="225" font-size="14" font-weight="bold" fill="#1e6b44">datasets</text>
  <text x="58" y="244" font-size="12" fill="#3a4250">Mayo DICOM · DeepLesion PNG · 2DeteCT raw sinograms · Box / HTTP Range downloads · splits</text>
  <line x1="200" y1="254" x2="200" y2="270" stroke="#5b6475" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="254" x2="490" y2="270" stroke="#5b6475" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- infra | viz -->
  <rect x="40" y="272" width="380" height="66" rx="10" fill="#f6f2fb" stroke="#8a63c4"/>
  <text x="58" y="295" font-size="14" font-weight="bold" fill="#5d3c96">infra</text>
  <text x="58" y="314" font-size="12" fill="#3a4250">projection matrices (ASTRA / Siddon) · HDF5 stores</text>
  <text x="58" y="330" font-size="12" fill="#3a4250">RunStore · ResultsStore · manifest · runtime · GPUs</text>
  <rect x="436" y="272" width="204" height="66" rx="10" fill="#f6f2fb" stroke="#8a63c4"/>
  <text x="454" y="295" font-size="14" font-weight="bold" fill="#5d3c96">viz</text>
  <text x="454" y="314" font-size="12" fill="#3a4250">paper figures</text>
  <text x="454" y="330" font-size="12" fill="#3a4250">CSV / Markdown / LaTeX tables</text>
  <text x="428" y="309" text-anchor="middle" font-size="12" fill="#8a63c4">|</text>
  <line x1="340" y1="338" x2="340" y2="354" stroke="#5b6475" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- config -->
  <rect x="40" y="356" width="600" height="46" rx="10" fill="#fdf4e8" stroke="#d9822b"/>
  <text x="58" y="384" font-size="14" font-weight="bold" fill="#9a5414">config</text>
  <text x="128" y="384" font-size="12" fill="#3a4250">YAML read once → typed dataclasses (Config, ExperimentSpec), errors at load time</text>
  <line x1="340" y1="402" x2="340" y2="418" stroke="#5b6475" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- core -->
  <rect x="40" y="420" width="600" height="60" rx="10" fill="#fbecec" stroke="#c0504d"/>
  <text x="58" y="443" font-size="14" font-weight="bold" fill="#8f2f2c">core</text>
  <text x="112" y="443" font-size="12" fill="#3a4250">pure domain: numpy / scipy / torch only, no I/O, no configuration</text>
  <text x="58" y="464" font-size="12" fill="#3a4250">geometry · sparse operator · FBP · LEARN + 15 blocks · baselines · solvers · metrics · analysis</text>

  <!-- right column -->
  <text x="680" y="38" font-size="15" font-weight="bold" fill="#1f2530">around the library</text>
  <rect x="680" y="54" width="282" height="104" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-dasharray="5 4"/>
  <text x="698" y="78" font-size="14" font-weight="bold" fill="#1f2530">experiments/</text>
  <text x="698" y="98" font-size="12" fill="#3a4250">thesis analyses, figures, paper numbers</text>
  <text x="698" y="116" font-size="12" fill="#3a4250">imports lact; lact never imports it</text>
  <text x="698" y="134" font-size="12" fill="#6b7383">python -m experiments.paper.make_numbers</text>
  <path d="M680,106 C660,106 660,150 642,150" stroke="#5b6475" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="680" y="178" width="282" height="86" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-dasharray="5 4"/>
  <text x="698" y="202" font-size="14" font-weight="bold" fill="#1f2530">scripts/</text>
  <text x="698" y="222" font-size="12" fill="#3a4250">operations: rented Vast GPUs, school server,</text>
  <text x="698" y="240" font-size="12" fill="#3a4250">source packaging; they call the lact CLI</text>
  <path d="M680,221 C650,221 660,80 642,80" stroke="#5b6475" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="680" y="284" width="282" height="104" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-dasharray="5 4"/>
  <text x="698" y="308" font-size="14" font-weight="bold" fill="#1f2530">configs/</text>
  <text x="698" y="328" font-size="12" fill="#3a4250">data · geometry · model · train ·</text>
  <text x="698" y="346" font-size="12" fill="#3a4250">experiment grids · data variants · env</text>
  <text x="698" y="364" font-size="12" fill="#6b7383">merged: defaults → local.yaml → -c → -s</text>

  <rect x="680" y="408" width="282" height="72" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-dasharray="5 4"/>
  <text x="698" y="432" font-size="14" font-weight="bold" fill="#1f2530">tests/</text>
  <text x="698" y="452" font-size="12" fill="#3a4250">unit · integration (synthetic data) ·</text>
  <text x="698" y="470" font-size="12" fill="#3a4250">regression (finished thesis runs)</text>
</svg>
