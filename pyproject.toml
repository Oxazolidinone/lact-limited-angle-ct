[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lact"
version = "0.4.0"
description = "LEARN-DenseNet deep unrolling with an L-BFGS data step for limited-angle fan-beam CT, with compared methods"
authors = [{ name = "Nguyen Anh Minh" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "h5py>=3.8",
    "pydicom>=2.4",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
astra = ["astra-toolbox>=2.1"]
track = ["tensorboard>=2.14"]
dev = ["pytest>=7.4", "scikit-image>=0.21", "ruff>=0.4", "mypy>=1.8", "import-linter>=2.0", "pre-commit>=3.5",
       "types-PyYAML"]

[project.scripts]
lact = "lact.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------ tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests",
    "regression: pins outputs of finished runs (needs LACT_RESULTS_DIR)",
]

# ------------------------------------------------------------------ lint / types
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "SIM", "RUF", "PT"]
ignore = [
    "E731", "B905",
    # °, ×, – and Greek letters are intended in scientific text and messages
    "RUF001", "RUF002", "RUF003",
    # style preferences, not defects: tuple concatenation, zip(x, x[1:]), forced ternaries
    "RUF005", "RUF007", "SIM108",
    # tests assert several related facts at once; pytest.raises(ValueError) without match is fine for programmer errors
    "PT018", "PT011",
    # pydocstyle: a docstring is expected where it adds information, not on every public name
    "D1",
    # house style: the summary may wrap onto a second line; the closing quotes end the last line
    "D205", "D209",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# indented literal block (file layout) inside the module docstring
"src/lact/infra/stores/run_store.py" = ["D208"]

[tool.ruff.lint.isort]
known-first-party = ["lact"]

[tool.mypy]
python_version = "3.10"
files = ["src/lact"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# ------------------------------------------------------------------ architecture (lint-imports)
[tool.importlinter]
root_package = "lact"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli -> services -> datasets -> infra -> config -> core"
type = "layers"
layers = ["lact.cli", "lact.services", "lact.datasets", "lact.infra", "lact.config", "lact.core"]

[[tool.importlinter.contracts]]
name = "Pure core: no I/O, no configuration reading, no plotting"
type = "forbidden"
source_modules = ["lact.core"]
forbidden_modules = ["h5py", "pydicom", "astra", "yaml"]

[[tool.importlinter.contracts]]
name = "Only infra.operators.astra_matrix may import ASTRA"
type = "forbidden"
source_modules = ["lact.config", "lact.services", "lact.cli", "lact.datasets", "lact.infra.data",
                  "lact.infra.io", "lact.infra.stores", "lact.infra.system", "lact.infra.operators.operator_store",
                  "lact.infra.operators.siddon"]
forbidden_modules = ["astra"]
allow_indirect_imports = true
