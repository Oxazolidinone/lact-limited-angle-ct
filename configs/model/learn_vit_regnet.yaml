# LEARN-ViT-RegNet: the Transformer core of LEARN-ViT (D = 192, 6 layers, 6 heads, 1,024 tokens) + RegNetY-200MF. ViT
# has no stages, so the first three stages of RegNetY-200MF (Y blocks, w = [24, 56, 152], 8x downsampling) replace the
# 8x8 patch cutting; the last stage is the Transformer core; the decoder has the skips of the shared framework. ~3.51M
# (-4.3% vs learn_vit).
_base_: [_common.yaml]
model:
  arch: learn_vit_regnet
  regularizer:
    name: vit_regnet
    # img_size: taken from data.img_size_rec when the model is built
    regnet: {w0: 24, wa: 36.44, wm: 2.49, depth: 13}
    group_width: 8
    se_ratio: 0.25
    dim: 192
    depth: 6
    heads: 6
    mlp_ratio: 4
    dec_depth: 1
    gn_groups: 8
