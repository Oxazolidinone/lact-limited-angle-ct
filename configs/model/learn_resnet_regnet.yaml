# LEARN-ResNet-RegNet: the BasicBlock of LEARN-ResNet + RegNetY-200MF.
# Integrating RegNetY-200MF: keep the family's block type, take the layout from the 200MF rule (wm = 2.49, 13 blocks =>
# d = [1, 1, 4, 7]) and add SE with ratio 0.25 to each block (as in the Y block). Widths scaled by s = 0.45 (w0 = 24 s,
# wa = 36.44 s) so the parameter count matches the uniform-layout version: w = [8, 24, 64, 168], 4.23M (+3.5% vs
# learn_resnet).
_base_: [_common.yaml]
model:
  arch: learn_resnet_regnet
  regularizer:
    name: resnet_regnet
    regnet: {w0: 10.8, wa: 16.4, wm: 2.49, depth: 13}
    se_ratio: 0.25
    dec_depth: 1
    gn_groups: 8
