# LEARN-ResNeXt: X block (grouped-convolution bottleneck, as in ResNeXt) with a UNIFORM LAYOUT, no SE. ~2.95M
# parameters. The uniform-layout version of the X-block family; the RegNet-integrated version of this family is
# LEARN-RegNet (RegNetY-200MF, 3.14M).
_base_: [_common.yaml]
model:
  arch: learn_resnext
  regularizer:
    name: resnext_ed
    channels: [64, 128, 256, 512]
    depths: [2, 2, 2, 2]
    group_width: 32
    se_ratio: 0.0
    dec_depth: 1
    gn_groups: 8
