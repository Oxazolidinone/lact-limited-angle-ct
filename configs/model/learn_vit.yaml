# LEARN-ViT: 8x8 patches (1,024 tokens), D=192, 6 layers, 6 heads. ~3.67M parameters.
_base_: [_common.yaml]
model:
  arch: learn_vit
  regularizer:
    name: vit
    # img_size: taken from data.img_size_rec when the model is built
    patch: 8
    dim: 192
    depth: 6
    heads: 6
    mlp_ratio: 4
    stem_channels: 32
