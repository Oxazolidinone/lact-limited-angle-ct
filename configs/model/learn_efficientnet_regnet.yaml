# LEARN-EfficientNet-RegNet: the MBConv block of LEARN-EfficientNet + RegNetY-200MF.
# Integrating RegNetY-200MF: keep the family's block type, take the layout from the 200MF rule (wm = 2.49, 13 blocks =>
# d = [1, 1, 4, 7]) and keep the SE 0.25 that MBConv already has (already like the Y block). Widths scaled by s = 0.46
# (w0 = 24 s, wa = 36.44 s) so the parameter count matches the uniform-layout version: w = [8, 24, 72, 168], 2.49M
# (-0.7% vs learn_efficientnet).
_base_: [_common.yaml]
model:
  arch: learn_efficientnet_regnet
  regularizer:
    name: mbconv_regnet
    regnet: {w0: 11.04, wa: 16.76, wm: 2.49, depth: 13}
    se_ratio: 0.25
    expand: 4
    kernel: 3
    dec_depth: 1
    gn_groups: 8
