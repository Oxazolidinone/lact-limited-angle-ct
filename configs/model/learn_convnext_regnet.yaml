# LEARN-ConvNeXt-RegNet: the ConvNeXt block of LEARN-ConvNeXt + RegNetY-200MF.
# Integrating RegNetY-200MF: keep the family's block type, take the layout from the 200MF rule (wm = 2.49, 13 blocks =>
# d = [1, 1, 4, 7]) and add SE with ratio 0.25 to each block (as in the Y block). Widths scaled by s = 0.45 (w0 = 24 s,
# wa = 36.44 s) so the parameter count matches the uniform-layout version: w = [8, 24, 64, 168], 2.06M (+3.9% vs
# learn_convnext).
_base_: [_common.yaml]
model:
  arch: learn_convnext_regnet
  regularizer:
    name: convnext_regnet
    regnet: {w0: 10.8, wa: 16.4, wm: 2.49, depth: 13}
    se_ratio: 0.25
    dec_depth: 1
    kernel: 7
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path: 0.0
