# CG-GLORE (BMVC 2026, arXiv:2608.15246), rebuilt from the authors' code in src/lact/core/models/baselines/cg_glore.py.
# NOT part of the LEARN framework: 15 layers with their own weights; each layer is a regularisation block (5x5 conv +
# Nyström attention) followed by 10 CG iterations on the system (alpha * FBP∘A + I). 5.52M parameters (the paper reports
# 5.5M). Training recipe: configs/train/bmvc.yaml through the cmp_* grids (the recipe of the original code).
model:
  framework: cg_glore
  arch: cg_glore
  K: 15                    # number of layers
  grad_checkpoint: false
  regularizer:
    name: cg_glore         # name used for lr, tables and figures
    channels: 64           # channels of the regularisation block
    kernel: 5
    scale: 2               # feature maps cut into 2 x 2 patches; token = 4 x 64 = 256 dimensions, 128^2 tokens
    heads: 2
    landmarks: 384         # number of Nyström landmarks
    pinv_iters: 2          # iterations of the pseudo-inverse computation
    dropout: 0.1
    cg_iters: 10           # CG iterations per layer
    alpha0: 0.1            # initial alpha_k
