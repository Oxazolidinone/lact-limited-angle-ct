# LEARN-RegNet: RegNetY-200MF (Radosavovic et al., 2020) in the shared encoder-decoder framework. ~3.14M parameters.
# Y block = X block (Conv 1x1 - grouped Conv 3x3 - Conv 1x1, bottleneck ratio 1) + Squeeze-and-Excitation with ratio
# 0.25. Layout from the quantised linear rule of the 200MF version: w = [24, 56, 152, 368], d = [1, 1, 4, 7], g = 8.
_base_: [_common.yaml]
model:
  arch: learn_regnet
  regularizer:
    name: regnet_ed
    regnet: {w0: 24, wa: 36.44, wm: 2.49, depth: 13}
    group_width: 8
    se_ratio: 0.25         # 0 => RegNetX-200MF (2,65M)
    dec_depth: 1
    gn_groups: 8
