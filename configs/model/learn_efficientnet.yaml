# LEARN-EfficientNet: MBConv block (4x expansion, depthwise 3x3, SE 0.25, SiLU) + GroupNorm. ~2.51M parameters.
_base_: [_common.yaml]
model:
  arch: learn_efficientnet
  regularizer:
    name: mbconv_ed
    channels: [32, 64, 128, 256]
    depths: [2, 2, 2, 2]
    expand: 4
    kernel: 3
    se_ratio: 0.25
    dec_depth: 1
    gn_groups: 8
