# LEARN-ConvNeXt: the same encoder-decoder framework with ConvNeXt blocks. ~1.98M parameters.
_base_: [_common.yaml]
model:
  arch: learn_convnext
  regularizer:
    name: convnext_ed
    channels: [32, 64, 128, 256]
    depths: [2, 2, 2, 2]
    dec_depth: 1
    kernel: 7
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path: 0.0
