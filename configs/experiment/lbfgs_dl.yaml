# LEARN-DenseNet with the L-BFGS data step on DeepLesion; same recipe as lbfgs_mayo.
#   lact train grid configs/experiment/lbfgs_dl.yaml -c configs/variant/joint.yaml --run
exp: lbfgs_dl
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_dl.yaml
  - configs/train/default.yaml        # Adam, cosine, 50 epochs, batch 1, MSE
lr_table: {densenet_ed: 3.0e-4}
grid:
  model: [configs/model/learn_densenet.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
overrides: [model.update=lbfgs, model.lbfgs_memory=13, model.lbfgs_damping=0.5]
