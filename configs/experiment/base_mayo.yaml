# First-order models on Mayo (joint store, Mayo 7/1/2 split): LEARN-DenseNet (lr 3e-4) and RegFormer (lr 1e-4,
# as in its original code), 2 geometries, 50 epochs, default recipe (configs/train/default.yaml).
#   lact train grid configs/experiment/base_mayo.yaml -c configs/variant/joint.yaml --run
exp: base_mayo
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_mayo.yaml
  - configs/train/default.yaml        # Adam, cosine, 50 epochs, batch 1, MSE
lr_table: {densenet_ed: 3.0e-4, regformer: 1.0e-4}
grid:
  model: [configs/model/learn_densenet.yaml, configs/model/regformer.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
