# Compared methods on Mayo: original LEARN, FBPConvNet and Learned Primal-Dual, trained from scratch on the same
# images, sinograms and split as the runs above, with the shared recipe of the CG-GLORE paper (BMVC 2026;
# configs/train/bmvc.yaml: AdamW, lr 1e-4, weight decay 1e-2, cosine to 1e-5, 50 epochs, batch 1). DPMA has its
# own grids (two training stages).
#   lact train grid configs/experiment/cmp_mayo.yaml -c configs/variant/joint.yaml --run
exp: cmp_mayo
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_mayo.yaml
  - configs/train/bmvc.yaml           # training recipe of the CG-GLORE paper
lr_table: {fbpconvnet: 1.0e-4, lpd: 1.0e-4, learn_orig: 1.0e-4}
grid:
  model: [configs/model/learn_orig.yaml, configs/model/fbpconvnet.yaml, configs/model/lpd.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
