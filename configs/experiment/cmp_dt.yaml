# Compared methods on 2DeteCT; same methods and recipe as cmp_mayo.
#   lact train grid configs/experiment/cmp_dt.yaml -c configs/variant/detect.yaml --run
exp: cmp_dt
configs:
  - configs/paths.yaml
  - configs/data/detect.yaml          # measured 2DeteCT; the store is set by -c configs/variant/detect.yaml
  - configs/data/split_detect.yaml
  - configs/train/bmvc.yaml           # training recipe of the CG-GLORE paper
lr_table: {fbpconvnet: 1.0e-4, lpd: 1.0e-4, learn_orig: 1.0e-4}
grid:
  model: [configs/model/learn_orig.yaml, configs/model/fbpconvnet.yaml, configs/model/lpd.yaml]
  geometry: [configs/geometry/dt_a120.yaml, configs/geometry/dt_a90.yaml]
  seed: [0]
