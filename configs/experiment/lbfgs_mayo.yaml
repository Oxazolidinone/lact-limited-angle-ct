# LEARN-DenseNet with the L-BFGS data step on Mayo, trained from scratch with the recipe of its first-order run
# (lr 3e-4, 50 epochs): H0 = I, alpha initialised to 1, memory of every earlier stage (13 pairs), Powell damping
# 0.5 (without damping, training from scratch diverges).
#   lact train grid configs/experiment/lbfgs_mayo.yaml -c configs/variant/joint.yaml --run
exp: lbfgs_mayo
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_mayo.yaml
  - configs/train/default.yaml        # Adam, cosine, 50 epochs, batch 1, MSE
lr_table: {densenet_ed: 3.0e-4}
grid:
  model: [configs/model/learn_densenet.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
overrides: [model.update=lbfgs, model.lbfgs_memory=13, model.lbfgs_damping=0.5]
