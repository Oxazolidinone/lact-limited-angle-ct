# E2: learning-rate selection. 15 models x 3 lr, 120°, seed 0, 20 epochs => 45 runs. Models: LEARN-CNN + 7 families
# (U-Net, ResNet, ResNeXt/RegNet, DenseNet, EfficientNet, ConvNeXt, ViT), each with two layouts (uniform and RegNet).
# Run a subset: lact pipeline run --models learn_cnn learn_resnet ...
exp: e2_sweep
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml
  - configs/data/split_7_1_2.yaml
  - configs/train/sweep_lr.yaml
grid:
  model: [configs/model/learn_cnn.yaml, configs/model/learn_unet.yaml, configs/model/learn_unet_regnet.yaml,
          configs/model/learn_resnet.yaml, configs/model/learn_resnet_regnet.yaml,
          configs/model/learn_resnext.yaml, configs/model/learn_regnet.yaml,
          configs/model/learn_densenet.yaml, configs/model/learn_densenet_regnet.yaml,
          configs/model/learn_efficientnet.yaml, configs/model/learn_efficientnet_regnet.yaml,
          configs/model/learn_convnext.yaml, configs/model/learn_convnext_regnet.yaml,
          configs/model/learn_vit.yaml, configs/model/learn_vit_regnet.yaml]
  geometry: [configs/geometry/fan_a120.yaml]
  seed: [0]
  lr: [3.0e-5, 1.0e-4, 3.0e-4]
