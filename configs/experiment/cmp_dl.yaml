# Compared methods on DeepLesion; same methods and recipe as cmp_mayo.
#   lact train grid configs/experiment/cmp_dl.yaml -c configs/variant/joint.yaml --run
exp: cmp_dl
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_dl.yaml
  - configs/train/bmvc.yaml           # training recipe of the CG-GLORE paper
lr_table: {fbpconvnet: 1.0e-4, lpd: 1.0e-4, learn_orig: 1.0e-4}
grid:
  model: [configs/model/learn_orig.yaml, configs/model/fbpconvnet.yaml, configs/model/lpd.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
