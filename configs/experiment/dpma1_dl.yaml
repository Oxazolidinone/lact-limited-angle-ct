# DPMA stage 1 on DeepLesion; feeds dpma_dl.
#   lact train grid configs/experiment/dpma1_dl.yaml -c configs/variant/joint.yaml --run
exp: dpma1_dl
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_dl.yaml
  - configs/train/bmvc.yaml           # training recipe of the CG-GLORE paper (50 epochs per stage)
lr_table: {dpma: 1.0e-4}
overrides: [model.regularizer.stage=1]
grid:
  model: [configs/model/dpma.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
