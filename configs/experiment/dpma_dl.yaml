# DPMA, stage 2 on the DeepLesion set (docs/PHASE2.md, section 10): load M1 from the dpma1_dl run of the same geometry
# (frozen), then train network M2 from scratch, 2 runs {90°, 120°}. These are the two stages of ONE method as in the
# original code, not further training of an existing model. DPMA's results in the tables are these runs (evaluation adds
# 300 refinement iterations).
exp: dpma_dl
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_dl.yaml
  - configs/train/bmvc.yaml           # training recipe of the CG-GLORE paper (50 epochs per stage)
lr_table: {dpma: 1.0e-4}
overrides: [train.init_from=dpma1_dl]
grid:
  model: [configs/model/dpma.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
