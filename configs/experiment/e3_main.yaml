# E3: the main experiment. 15 models x {90°, 120°} x 3 seeds, 50 epochs => 90 runs.
exp: e3_main
_base_: [_base.yaml]
lr_from: e2_sweep   # best lr from <paths.runs>/e2_sweep/best_lr.json (lact report select-lr)
grid:
  model: [configs/model/learn_cnn.yaml, configs/model/learn_unet.yaml, configs/model/learn_unet_regnet.yaml,
          configs/model/learn_resnet.yaml, configs/model/learn_resnet_regnet.yaml,
          configs/model/learn_resnext.yaml, configs/model/learn_regnet.yaml,
          configs/model/learn_densenet.yaml, configs/model/learn_densenet_regnet.yaml,
          configs/model/learn_efficientnet.yaml, configs/model/learn_efficientnet_regnet.yaml,
          configs/model/learn_convnext.yaml, configs/model/learn_convnext_regnet.yaml,
          configs/model/learn_vit.yaml, configs/model/learn_vit_regnet.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
# Since 05/10/2026 each configuration is trained with ONE seed only. Seeds 1, 2 remain only in runs trained earlier (the
# first four architectures on Mayo): they are still evaluated, and the report takes the seed with the best validation
# PSNR (docs/decisions.md).
keep_finished_seeds: [1, 2]
