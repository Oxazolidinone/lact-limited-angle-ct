# DPMA stage 2 on Mayo: loads M1 from the dpma1_mayo run of the same geometry (frozen) and trains network M2 from
# scratch. Evaluation adds the 300 non-learned refinement iterations of the original code.
#   lact train grid configs/experiment/dpma_mayo.yaml -c configs/variant/joint.yaml --run
exp: dpma_mayo
configs:
  - configs/paths.yaml
  - configs/data/mayo_3mm.yaml        # intensity/grid defaults; joint store set by -c configs/variant/joint.yaml
  - configs/data/split_joint_mayo.yaml
  - configs/train/bmvc.yaml           # training recipe of the CG-GLORE paper (50 epochs per stage)
lr_table: {dpma: 1.0e-4}
overrides: [train.init_from=dpma1_mayo]
grid:
  model: [configs/model/dpma.yaml]
  geometry: [configs/geometry/fan_a120.yaml, configs/geometry/fan_a90.yaml]
  seed: [0]
