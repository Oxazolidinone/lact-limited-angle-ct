# Data variant: Mayo + Poisson noise, I0 = 10^6 photons/ray (standard dose, as in GloReDi / QN-Mixer).
# Re-runs exactly the E0-E6 pipeline on the noisy sinograms, with results kept apart in outputs_poisson_1e6/:
#   lact pipeline run -c configs/variant/mayo_poisson_1e6.yaml --device cuda
# Reuses the reference images (images.h5) and the projection matrices of the noise-free set; only sinograms + FBP are
# re-simulated. E0 and E1 check the operator/angular density on noise-free projections, so they match the original set.
paths:
  outputs: outputs_poisson_1e6
  data: outputs_poisson_1e6/data          # noisy sinograms + own manifest
  operators: outputs/operators            # shared matrix A (same geometry)
  runs: outputs_poisson_1e6/runs
  eval: outputs_poisson_1e6/eval
  tables: outputs_poisson_1e6/tables
  figures: outputs_poisson_1e6/figures
  baselines: outputs_poisson_1e6/baselines   # TV re-tuned on the noisy data
data:
  images_h5: outputs/data/images.h5
  stats_json: outputs/data/stats.json
  slices_json: outputs/data/slices.json
noise:
  type: poisson
  I0: 1.0e6
  seed: 1234
cache:
  dir: cache/poisson_1e6     # own cache: the sinogram files have the same names as the noise-free set's
