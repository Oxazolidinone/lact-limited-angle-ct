# Data variant: Mayo + Poisson noise, I0 = 10^5 photons/ray (stronger noise, as in Huang et al. 2019).
# Re-runs exactly the E0-E6 pipeline on the noisy sinograms, with results kept apart in outputs_poisson_1e5/:
#   lact pipeline run -c configs/variant/mayo_poisson_1e5.yaml --device cuda
# Reuses the reference images (images.h5) and the projection matrices of the noise-free set; only sinograms + FBP are
# re-simulated. E0 and E1 check the operator/angular density on noise-free projections, so they match the original set.
paths:
  outputs: outputs_poisson_1e5
  data: outputs_poisson_1e5/data          # noisy sinograms + own manifest
  operators: outputs/operators            # shared matrix A (same geometry)
  runs: outputs_poisson_1e5/runs
  eval: outputs_poisson_1e5/eval
  tables: outputs_poisson_1e5/tables
  figures: outputs_poisson_1e5/figures
  baselines: outputs_poisson_1e5/baselines   # TV re-tuned on the noisy data
data:
  images_h5: outputs/data/images.h5
  stats_json: outputs/data/stats.json
  slices_json: outputs/data/slices.json
noise:
  type: poisson
  I0: 1.0e5
  seed: 1234
cache:
  dir: cache/poisson_1e5     # own cache: the sinogram files have the same names as the noise-free set's
