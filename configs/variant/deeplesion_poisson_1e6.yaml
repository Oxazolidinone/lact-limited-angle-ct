# Data variant: DeepLesion + Poisson noise, I0 = 10^6 photons/ray. Same E0-E6 pipeline, separate outputs.
#   lact pipeline run -c configs/variant/deeplesion_poisson_1e6.yaml --device cuda
# Reuses the reference images and split file of the (noise-free) deeplesion variant and the shared projection matrices;
# only the noisy sinograms + FBP are re-simulated, and TV and the lr sweep are redone on the noisy data.
_base_: [../data/deeplesion.yaml, ../data/split_deeplesion.yaml]
paths:
  outputs: outputs_deeplesion_poisson_1e6
  data: outputs_deeplesion_poisson_1e6/data
  operators: outputs/operators
  runs: outputs_deeplesion_poisson_1e6/runs
  eval: outputs_deeplesion_poisson_1e6/eval
  tables: outputs_deeplesion_poisson_1e6/tables
  figures: outputs_deeplesion_poisson_1e6/figures
  baselines: outputs_deeplesion_poisson_1e6/baselines
data:
  images_h5: outputs_deeplesion/data/images.h5
  stats_json: outputs_deeplesion/data/stats.json
  slices_json: outputs_deeplesion/data/slices.json
noise:
  type: poisson
  I0: 1.0e6
  seed: 1234
cache:
  dir: cache/deeplesion_poisson_1e6
